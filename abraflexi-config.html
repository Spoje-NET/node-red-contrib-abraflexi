<script type="text/javascript">
    RED.nodes.registerType('abraflexi-config', {
        category: 'config',
        defaults: {
            url:     { value: 'https://demo.flexibee.eu', required: true },
            company: { value: 'demo', required: true }
        },
        credentials: {
            user:     { type: 'text' },
            password: { type: 'password' }
        },
        label: function () {
            return (this.url || 'AbraFlexi') + '/c/' + (this.company || '?');
        }
    });
</script>

<script type="text/html" data-template-name="abraflexi-config">
    <div class="form-row">
        <label for="node-config-input-url"><i class="fa fa-globe"></i> URL serveru</label>
        <input type="text" id="node-config-input-url" placeholder="https://vase-firma:5434">
    </div>
    <div class="form-row">
        <label for="node-config-input-company"><i class="fa fa-building"></i> Firma</label>
        <input type="text" id="node-config-input-company" placeholder="demo">
    </div>
    <div class="form-row">
        <label for="node-config-input-user"><i class="fa fa-user"></i> Uživatel</label>
        <input type="text" id="node-config-input-user" placeholder="admin">
    </div>
    <div class="form-row">
        <label for="node-config-input-password"><i class="fa fa-key"></i> Heslo</label>
        <input type="password" id="node-config-input-password">
    </div>
</script>

<script type="text/html" data-help-name="abraflexi-config">
    <p>Sdílená konfigurace připojení k serveru AbraFlexi / FlexiBee. Používají ji všechny
       AbraFlexi uzly pro načítání záznamů přes REST API.</p>
    <dl class="message-properties">
        <dt>URL serveru <span class="property-type">string</span></dt>
        <dd>Základní URL REST API, např. <code>https://vase-firma:5434</code>.</dd>
        <dt>Firma <span class="property-type">string</span></dt>
        <dd>Kód firmy (company code) v AbraFlexi, např. <code>demo</code>.</dd>
        <dt>Uživatel / Heslo</dt>
        <dd>Přihlašovací údaje pro REST API. Uloženy zašifrovaně v Node-RED credentials.</dd>
    </dl>
</script>
