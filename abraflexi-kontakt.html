<script type="text/javascript">
    RED.nodes.registerType('abraflexi-kontakt', {
        category:    'AbraFlexi',
        color:       '#4C90B8',
        defaults: {
            name:   { value: '' },
            server: { value: '', type: 'abraflexi-config', required: true }
        },
        inputs:       1,
        outputs:      1,
        icon:         'adresar.svg',
        paletteLabel: 'Kontakt',
        label:        function () { return this.name || 'Kontakt'; },
        labelStyle:   function () { return this.name ? 'node_label_italic' : ''; },
        inputLabels:  ['trigger / id'],
        outputLabels: ['záznam']
    });
</script>

<script type="text/html" data-template-name="abraflexi-kontakt">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Název</label>
        <input type="text" id="node-input-name" placeholder="Kontakt">
    </div>
    <div class="form-row">

        <input type="text" id="node-input-server">

<script type="text/html" data-help-name="abraflexi-kontakt">
    <p>Načte záznam <strong>kontakt</strong> z AbraFlexi podle ID.</p>

    <h3>Vstup</h3>
    <dl class="message-properties">
        <dt>payload.id <span class="property-type">string | number</span></dt>
        <dd>ID záznamu v AbraFlexi. Alternativně <code>msg.id</code>.</dd>
    </dl>

    <h3>Výstupy</h3>
    <ol class="node-ports">
        <li>Záznam
            <dl class="message-properties">
                <dt>payload <span class="property-type">object</span></dt>
                <dd>Celý záznam <code>kontakt</code> ze serveru (včetně polí jen pro čtení).
                    Klíčová pole: <code>id</code>, <code>lastUpdate</code>, <code>tel</code>, <code>mobil</code>, <code>email</code>, <code>prijmeni</code>, <code>jmeno</code>, <code>funkce</code>.</dd>
                <dt>writablePayload <span class="property-type">object</span></dt>
                <dd>Pouze zapisovatelná pole — bezpečné pro PUT/POST zpět do AbraFlexi.
                    Pole jen pro čtení (<code>readonlyFields</code>) jsou vynechána.</dd>
                <dt>readonlyFields <span class="property-type">array</span></dt>
                <dd>Seznam názvů polí označených v AbraFlexi API jako <em>isWritable=false</em>:
                    <code>id</code>, <code>lastUpdate</code>, <code>pocetPriloh</code>, <code>createdDate</code>, <code>updatedBy</code>, <code>createdBy</code>.</dd>
                <dt>topic <span class="property-type">string</span></dt>
                <dd><code>kontakt</code></dd>
                <dt>abraflexi_id <span class="property-type">string</span></dt>
                <dd>ID záznamu.</dd>
            </dl>
        </li>
    </ol>
</script>
